<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港簡單租屋網</title>
    <!-- 引入 Tailwind CSS 樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 font-sans">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md space-y-4 text-center">
        <h1 class="text-2xl font-bold text-blue-700">🏠 香港簡單租屋網</h1>
        <p class="text-slate-600 text-sm">單一檔案整合介面 - 資料庫連線測試</p>
        
        <button onclick="testConnection()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow hover:bg-blue-700 transition">
            立即測試資料庫連線
        </button>
        
        <div id="resultBox" class="bg-slate-50 p-4 rounded-xl text-left text-xs font-mono border overflow-x-auto max-h-60">
            等待測試點擊...
        </div>
    </div>

    <script>
        // Supabase 設定參數
        const SUPABASE_URL = "https://bvoqwjtvhlpmbigowghp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_IXkN9Thl9EjlyVFEoNaP2w_4eCNP8Xr";

        async function testConnection() {
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = "正在連線查詢資料庫...";
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    resultBox.innerHTML = `<span style="color: red;">❌ 查詢失敗 (HTTP ${response.status})：<br>${JSON.stringify(data, null, 2)}</span>`;
                } else {
                    resultBox.innerHTML = `<span style="color: green;">✅ 成功取得資料：<br>${JSON.stringify(data, null, 2)}</span>`;
                }
            } catch (err) {
                resultBox.innerHTML = `<span style="color: red;">❌ 發生異常錯誤：<br>${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
