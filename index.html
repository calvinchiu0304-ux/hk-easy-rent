<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球智慧租屋網 - 專業結構化版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-size: 22px; }
    .font-size-md { font-size: 18px; }
    .font-size-lg { font-size: 22px; }
    .font-size-xl { font-size: 26px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col font-size-lg" id="appBody">

  <!-- 頂部導覽列 -->
  <header class="bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-50 border-b border-blue-900">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-black tracking-wide cursor-pointer flex items-center gap-2 hover:opacity-95 transition" onclick="filterByDistrict('ALL')">
        <span>🌍</span> 全球智慧租屋網
      </h1>
      <!-- 字體大小切換 -->
      <div class="flex items-center space-x-1 bg-blue-900/80 p-1 rounded-xl text-sm border border-blue-700/50">
        <span class="px-2 text-blue-200 font-bold">字體:</span>
        <button onclick="changeFontSize('md')" id="btn-md" class="px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition">中</button>
        <button onclick="changeFontSize('lg')" id="btn-lg" class="px-2.5 py-1 bg-white text-blue-900 rounded-lg font-bold shadow-sm">大</button>
        <button onclick="changeFontSize('xl')" id="btn-xl" class="px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition">特大</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-3 md:p-6 flex-grow space-y-6">
    <!-- 主行動呼籲：業主放盤按鈕 -->
    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="openPostModal()" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black py-4 px-6 rounded-2xl shadow-md hover:shadow-lg text-xl flex items-center justify-center space-x-2 border-2 border-amber-300 active:scale-95 transition">
        <i class="fa-solid fa-circle-plus text-2xl"></i>
        <span>我要免費放盤 (結構化精準版)</span>
      </button>
    </div>

    <!-- 區域選擇選單 -->
    <section class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
        <h2 class="text-xl font-black text-blue-900 flex items-center"><i class="fa-solid fa-location-dot text-blue-600 mr-2"></i>選擇區域 / 城市</h2>
        <button onclick="filterByDistrict('ALL')" class="text-blue-700 font-bold underline text-base hover:text-blue-900 transition">顯示全部</button>
      </div>
      <div class="space-y-3">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">九龍區 / 熱門</span>
          <div class="flex flex-wrap gap-2" id="kowloonDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">港島區</span>
          <div class="flex flex-wrap gap-2" id="hkIslandDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">新界區 / 海外城市</span>
          <div class="flex flex-wrap gap-2" id="ntDistricts"></div>
        </div>
      </div>
    </section>

    <!-- 租盤標題與計數 -->
    <div class="flex justify-between items-end border-b-2 border-slate-300/80 pb-2 px-1">
      <h3 class="text-xl font-black text-slate-900" id="currentFilterText">所有最新租盤</h3>
      <span class="text-slate-500 font-bold" id="listingCount">共 0 個租盤</span>
    </div>

    <!-- 租盤列表容器 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="listingsContainer">
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-600"></i>
        <p class="font-bold">正在載入最新租盤...</p>
      </div>
    </div>
  </main>

  <!-- 免費放盤 彈出視窗 (Modal) -->
  <div id="postModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-blue-700">
      <button onclick="closePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-3xl font-black px-3 py-1">✕</button>

      <h2 class="text-2xl font-black text-blue-900 mb-1"><i class="fa-solid fa-house-medical mr-2 text-amber-500"></i>免費業主放盤</h2>
      <p class="text-slate-500 text-sm mb-4">請分別填寫大廈名稱與街道門牌，確保資訊 100% 準確一致。</p>

      <form id="listingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <!-- 相片上傳區塊 -->
        <div class="bg-slate-50 p-3.5 rounded-2xl border-2 border-dashed border-blue-300 space-y-2">
          <label class="block font-black text-slate-800 text-sm">1. 上傳單位相片 (選填)</label>
          <input type="file" id="imageFileInput" accept="image/*" onchange="previewSelectedImage(event)" class="w-full text-sm text-slate-500 file:mr-3 file:py-2 px-3 file:rounded-xl file:border-0 file:text-sm file:font-black file:bg-blue-100 file:text-blue-800 hover:file:bg-blue-200 cursor-pointer">
          <div id="imagePreviewContainer" class="hidden mt-2">
            <img id="imagePreview" class="h-44 w-full object-cover rounded-xl border-2 border-blue-400 shadow-sm">
          </div>
        </div>

        <div>
          <label class="block font-black text-slate-800 mb-1">2. 每月租金 (HKD / 當地貨幣)</label>
          <input type="number" id="priceInput" required placeholder="例如：12000" class="w-full p-3 border-2 border-slate-300 rounded-xl text-xl font-bold focus:border-blue-600 outline-none">
        </div>

        <!-- 結構化地址欄位：大廈名稱與門牌分開 -->
        <div class="space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
          <span class="block font-black text-blue-950 text-sm">3. 地址結構化填寫 (杜絕混亂)</span>
          
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">🏢 大廈 / 屋苑名稱 (例如：The ONE / 國康大樓)</label>
            <input type="text" id="buildingNameInput" required placeholder="例如：The ONE" class="w-full p-2.5 bg-white border-2 border-slate-300 rounded-xl text-base font-bold focus:border-blue-600 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">📍 詳細街道與門牌 (例如：彌敦道100號 / 荔枝角道98號)</label>
            <input type="text" id="streetAddressInput" required placeholder="例如：彌敦道100號" class="w-full p-2.5 bg-white border-2 border-slate-300 rounded-xl text-base font-bold focus:border-blue-600 outline-none">
          </div>
        </div>

        <div>
          <label class="block font-black text-slate-800 mb-1">4. 選擇區域 / 城市</label>
          <select id="districtInput" onchange="onDistrictChange()" required class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold bg-white focus:border-blue-600 outline-none"></select>
        </div>

        <!-- 交通資訊欄位 -->
        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-300/80 space-y-3">
          <span class="block font-black text-slate-800 text-sm">5. 交通與口岸指南 (自動預載)</span>
          <div>
            <label class="text-xs font-bold text-slate-600">🚇 主要鐵路 / 地鐵站</label>
            <input type="text" id="transportMtrInput" class="w-full p-2 border rounded-xl text-sm font-bold bg-white outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600">🚌 本地巴士 / 公車路線</label>
            <input type="text" id="transportBusInput" class="w-full p-2 border rounded-xl text-sm font-bold bg-white outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600">🚄 跨境交通 / 機場直達</label>
            <input type="text" id="transportChinaInput" class="w-full p-2 border rounded-xl text-sm font-bold bg-white outline-none focus:border-blue-600">
          </div>
        </div>

        <div class="bg-blue-50/70 p-3.5 rounded-2xl border border-blue-200 space-y-3">
          <span class="block font-black text-blue-950">6. 業主聯絡方式 (至少填一項)</span>
          <div>
            <label class="text-sm font-bold text-slate-700">電話 / WhatsApp / 海外號碼</label>
            <input type="tel" id="phoneInput" placeholder="例如：91234567" class="w-full p-2.5 border rounded-xl font-bold outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="text-sm font-bold text-slate-700">微信號 (WeChat ID) / 通訊軟體</label>
            <input type="text" id="wechatInput" placeholder="例如：hk_landlord_99" class="w-full p-2.5 border rounded-xl font-bold outline-none focus:border-blue-600">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition">
          🚀 即時發布結構化租盤
        </button>
      </form>
    </div>
  </div>

  <!-- 頁尾 Footer -->
  <footer class="bg-slate-900 text-slate-300 p-6 text-center text-base mt-auto space-y-1.5 border-t border-slate-800">
    <p class="font-bold">🌍 全球智慧租屋網 &copy; 2026</p>
    <p class="text-xs text-slate-400">本平台採用結構化真實數據標準，免手續費免登記。</p>
  </footer>

  <script>
    var SUPABASE_URL = "https://bvoqwjtvhlpmbigowghp.supabase.co";
    var SUPABASE_KEY = "sb_publishable_IXkN9Thl9EjlyVFEoNaP2w_4eCNP8Xr";

    const districtsData = {
      kowloon: ["油尖旺", "深水埗", "九龍城", "黃大仙", "觀塘"],
      hkIsland: ["中西區", "灣仔", "東區", "南區"],
      nt: ["荃灣", "屯門", "元朗", "北區", "大埔", "沙田", "西貢", "葵青", "布達佩斯 (海外)"]
    };

    const transportData = {
      "油尖旺": { mtr: "港鐵旺角站 E1出口 / 尖沙咀站 / The ONE", bus: "九巴 1, 1A, 2, 6, 9, 234X", china: "皇崗口岸直通巴 / 高鐵西九龍站直達" },
      "深水埗": { mtr: "港鐵深水埗站 C2出口 / 長沙灣站 / 太子站", bus: "九巴 2, 6F, 30X, 214 | 城巴 E21", china: "經屯馬線直達深圳灣口岸轉乘點" },
      "九龍城": { mtr: "港鐵宋皇臺站 B2出口 / 土瓜灣站 / 啟德", bus: "九巴 1A, 2A, 11X, 107", china: "直達九龍城跨境巴總站" },
      "黃大仙": { mtr: "港鐵黃大仙站 B3出口 / 鑽石山站", bus: "九巴 2F, 3C, 11, 85M", china: "鑽石山高鐵接駁專線" },
      "觀塘": { mtr: "港鐵觀塘站 A2出口 / 牛頭角站 / APM", bus: "九巴 1A, 14, 16, 89D, 215X", china: "觀塘跨境直通巴總站 (經皇崗)" },
      "中西區": { mtr: "港鐵中環站 D出口 / 上環站 / 香港站", bus: "城巴 1, 5B, 7, 10, 90B", china: "港澳碼頭跨境船 / 中環跨境巴" },
      "灣仔": { mtr: "港鐵灣仔站 A1出口 / 銅鑼灣站 / 會展站", bus: "城巴 1, 2, 8, 10, 72", china: "灣仔跨境直通巴總站 (皇崗/深圳灣)" },
      "東區": { mtr: "港鐵太古站 C出口 / 北角站 / 太古城", bus: "城巴 2, 18, 77, 102, 608", china: "北角碼頭直通巴專線" },
      "南區": { mtr: "港鐵黃竹坑站 B出口 / 海洋公園站", bus: "城巴 7, 37A, 70, 90, 97", china: "經香港仔隧道快捷前往西九高鐵站" },
      "荃灣": { mtr: "港鐵荃灣站 A1出口 / 荃灣西站", bus: "九巴 30X, 43X, 48X, 238M", china: "荃灣千色匯皇崗直通巴總站" },
      "屯門": { mtr: "港鐵屯門站 C出口 / 兆康站 / V city", bus: "九巴 58M, 60M, 960, 961", china: "深圳灣口岸 B3X 巴士 15 分鐘直達" },
      "元朗": { mtr: "港鐵元朗站 B出口 / 朗屏站 / YOHO", bus: "九巴 68M, 268C, 968", china: "福田/落馬洲口岸 B1 巴士 10 分鐘直達" },
      "北區": { mtr: "港鐵上水站 A出口 / 粉嶺站", bus: "九巴 73K, 78K, 277X, 278X", china: "緊鄰羅湖/落馬洲/香園圍口岸" },
      "大埔": { mtr: "港鐵大埔墟站 A出口 / 太和站", bus: "九巴 71A, 72X, 73X, 271", china: "東鐵線幾站直達羅湖/落馬洲" },
      "沙田": { mtr: "港鐵沙田站 A3出口 / 大圍站", bus: "九巴 47X, 80, 81, 88K, 280X", china: "東鐵線樞紐直達羅湖/高鐵西九龍站" },
      "西貢": { mtr: "港鐵坑口站 B出口 / 將軍澳站", bus: "九巴 92, 99, 299X", china: "將軍澳跨境巴士線" },
      "葵青": { mtr: "港鐵葵芳站 C出口 / 青衣站", bus: "九巴 31M, 37, 42A, 249M", china: "葵芳新都會跨境巴 / 港珠澳大橋接駁" },
      "離島": { mtr: "港鐵東涌站 C出口 / 機場快綫", bus: "嶼巴 37, 38, A35, E36A", china: "港珠澳大橋口岸巴士 10 分鐘直達" },
      "布達佩斯 (海外)": { mtr: "地鐵 M1 / M2 / M3 幹線 (Deák Ferenc tér)", bus: "市中心 46/47/49 號有軌電車", china: "李斯特費倫茨國際機場直達巴士 100E" }
    };

    let allListings = [];
    let currentDistrictFilter = 'ALL';
    let uploadedBase64Image = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderDistrictButtons();
      populateDistrictSelect();
      loadListings();
    });

    function changeFontSize(size) {
      const body = document.getElementById('appBody');
      body.classList.remove('font-size-md', 'font-size-lg', 'font-size-xl');
      body.classList.add(`font-size-${size}`);

      document.getElementById('btn-md').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById('btn-lg').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById('btn-xl').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById(`btn-${size}`).className = "px-2.5 py-1 bg-white text-blue-900 rounded-lg font-bold shadow-sm";
    }

    function renderDistrictButtons() {
      const createBtn = d => `<button onclick="filterByDistrict('${d}')" class="district-btn px-3 py-1.5 bg-slate-100 hover:bg-blue-700 hover:text-white rounded-xl font-bold text-sm sm:text-base border border-slate-200/80 transition active:scale-95">${d}</button>`;
      document.getElementById('kowloonDistricts').innerHTML = districtsData.kowloon.map(createBtn).join('');
      document.getElementById('hkIslandDistricts').innerHTML = districtsData.hkIsland.map(createBtn).join('');
      document.getElementById('ntDistricts').innerHTML = districtsData.nt.map(createBtn).join('');
    }

    function populateDistrictSelect() {
      const select = document.getElementById('districtInput');
      const allDistricts = [...districtsData.kowloon, ...districtsData.hkIsland, ...districtsData.nt];
      select.innerHTML = allDistricts.map(d => `<option value="${d}">${d}</option>`).join('');
      onDistrictChange();
    }

    function onDistrictChange() {
      const district = document.getElementById('districtInput').value;
      const info = transportData[district] || { mtr: "鄰近主要地鐵站", bus: "多條公車路線", china: "交通便利" };
      document.getElementById('transportMtrInput').value = info.mtr;
      document.getElementById('transportBusInput').value = info.bus;
      document.getElementById('transportChinaInput').value = info.china;
    }

    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          uploadedBase64Image = e.target.result;
          document.getElementById('imagePreview').src = uploadedBase64Image;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function openMap(query) {
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      window.open(url, '_blank');
    }

    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-600"></i><p class="font-bold">載入中...</p></div>`;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        allListings = await response.json();
        renderListings();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-bold">無法載入租盤數據，請重新整理頁面。</div>`;
        document.getElementById('listingCount').innerText = "共 0 個租盤";
      }
    }

    function renderListings() {
      const container = document.getElementById('listingsContainer');
      let data = allListings;

      if (currentDistrictFilter !== 'ALL') {
        data = allListings.filter(item => item.district === currentDistrictFilter);
      }

      document.getElementById('listingCount').innerText = `共 ${data.length} 個租盤`;
      document.getElementById('currentFilterText').innerText = currentDistrictFilter === 'ALL' ? '所有最新租盤' : `${currentDistrictFilter} 租盤`;

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold bg-white rounded-3xl border border-slate-200">該區暫時未有業主放盤。</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const defaultImg = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80";
        const imgUrl = item.image_url || defaultImg;
        const transportMtr = item.transport_mtr || '鄰近地鐵站';
        const transportBus = item.transport_bus || '多條公車路線';
        const transportChina = item.transport_china || '交通便利';

        // 統一格式化地址顯示：大廈名稱 + 街道門牌
        const buildingDisplay = item.building_name ? `<span class="text-blue-900 font-black">${item.building_name}</span>` : '';
        const streetDisplay = item.street_address ? `<span class="text-slate-700">${item.street_address}</span>` : (item.address || '');
        const fullMapQuery = `${item.building_name || ''} ${item.street_address || item.address || ''}`;

        let whatsappBtn = item.phone ? `<a href="https://wa.me/852${item.phone.replace(/[^0-9]/g, '')}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-center text-sm shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp</a>` : `<div class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">無WhatsApp</div>`;
        
        let wechatBtn = item.wechat_id ? `<button onclick="copyWeChat('${item.wechat_id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3 rounded-xl text-center text-sm shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-brands fa-weixin text-lg"></i> 微信號</button>` : `<div class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">無微信號</div>`;

        let phoneBtn = item.phone ? `<a href="tel:${item.phone}" class="col-span-2 bg-blue-700 hover:bg-blue-800 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-solid fa-phone text-lg"></i> 致電業主 (${item.phone})</a>` : `<div class="col-span-2 bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">業主未留電話</div>`;

        return `
          <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-md border border-slate-200/90 flex flex-col justify-between transition">
            <div>
              <div class="relative h-56 bg-slate-200">
                <img src="${imgUrl}" alt="租盤圖片" class="w-full h-full object-cover">
                <span class="absolute top-3 left-3 bg-blue-800/90 text-white font-black px-3 py-1 rounded-xl text-base shadow-sm">${item.district || '區域'}</span>
                <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white font-bold px-2.5 py-1 rounded-lg text-xs">30天效期</span>
              </div>
              <div class="p-4 space-y-3">
                <span class="text-3xl font-black text-amber-600 tracking-tight">HK$ ${Number(item.price || 0).toLocaleString()} <span class="text-base font-normal text-slate-500">/月</span></span>
                
                <!-- 結構化清晰地址渲染 -->
                <h4 onclick="openMap('${fullMapQuery}')" class="text-lg font-black text-slate-900 leading-snug cursor-pointer hover:text-blue-700 transition" title="點擊在地圖檢視實際地址">
                  <i class="fa-solid fa-location-dot text-red-500 mr-1.5"></i>
                  ${buildingDisplay} <span class="text-slate-400 font-normal">|</span> ${streetDisplay}
                </h4>
                
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70 text-sm space-y-2">
                  <div class="text-slate-800 font-bold flex items-center gap-1.5"><i class="fa-solid fa-train-subway text-blue-700"></i><span>${transportMtr}</span></div>
                  <div class="text-slate-600 text-xs flex items-center gap-1.5"><i class="fa-solid fa-bus text-emerald-600"></i><span>${transportBus}</span></div>
                  <div class="text-slate-600 text-xs flex items-center gap-1.5"><i class="fa-solid fa-train-tram text-purple-600"></i><span>${transportChina}</span></div>
                </div>
              </div>
            </div>

            <div class="p-4 pt-0 space-y-2">
              <div class="grid grid-cols-2 gap-2">
                ${whatsappBtn}
                ${wechatBtn}
                ${phoneBtn}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterByDistrict(district) {
      currentDistrictFilter = district;
      renderListings();
    }

    function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
    function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 發布中，請稍候...";

      try {
        const districtVal = document.getElementById('districtInput').value;
        const buildingNameVal = document.getElementById('buildingNameInput').value.trim();
        const streetAddressVal = document.getElementById('streetAddressInput').value.trim();

        const newListing = {
          district: districtVal,
          building_name: buildingNameVal,
          street_address: streetAddressVal,
          address: `${buildingNameVal} - ${streetAddressVal}`, // 相容舊欄位
          price: Number(document.getElementById('priceInput').value),
          image_url: uploadedBase64Image,
          phone: document.getElementById('phoneInput').value || null,
          wechat_id: document.getElementById('wechatInput').value || null,
          transport_mtr: document.getElementById('transportMtrInput').value,
          transport_bus: document.getElementById('transportBusInput').value,
          transport_china: document.getElementById('transportChinaInput').value
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(newListing)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }

        alert("🎉 結構化租盤發布成功！資訊 100% 準確一致。");
        document.getElementById('listingForm').reset();
        uploadedBase64Image = null;
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        closePostModal();
        loadListings();
      } catch (err) {
        console.error(err);
        alert("發布失敗：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 即時發布結構化租盤";
      }
    }

    function copyWeChat(id) {
      navigator.clipboard.writeText(id);
      alert(`已複製業主通訊號：${id}`);
    }
  </script>
</body>
</html>
