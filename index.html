<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港極簡免登記租屋網 - 特大字版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-size: 22px; }
    .font-size-md { font-size: 18px; }
    .font-size-lg { font-size: 22px; }
    .font-size-xl { font-size: 26px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col font-size-lg" id="appBody">

  <!-- 頁首 Header -->
  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-black tracking-wide cursor-pointer flex items-center gap-2" onclick="filterByDistrict('ALL')">
        <span>🏠</span> 香港簡單租屋網
      </h1>
      <!-- 字體大小切換 (預設為特大) -->
      <div class="flex items-center space-x-1 bg-blue-800 p-1 rounded-lg text-sm">
        <span class="px-2 text-slate-200 font-bold">字體:</span>
        <button onclick="changeFontSize('md')" id="btn-md" class="px-2.5 py-1 rounded font-bold hover:bg-blue-600">中</button>
        <button onclick="changeFontSize('lg')" id="btn-lg" class="px-2.5 py-1 bg-white text-blue-700 rounded font-bold">大</button>
        <button onclick="changeFontSize('xl')" id="btn-xl" class="px-2.5 py-1 rounded font-bold hover:bg-blue-600">特大</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-3 md:p-6 flex-grow space-y-6">
    <!-- 放盤按鈕 -->
    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="openPostModal()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-4 px-6 rounded-2xl shadow-lg text-xl flex items-center justify-center space-x-2 border-2 border-amber-400 active:scale-95 transition">
        <i class="fa-solid fa-circle-plus text-2xl"></i>
        <span>我要免費放盤 (免登記)</span>
      </button>
    </div>

    <!-- 區域選擇選單 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-xl font-black text-slate-800"><i class="fa-solid fa-location-dot text-blue-600 mr-2"></i>選擇香港區域</h2>
        <button onclick="filterByDistrict('ALL')" class="text-blue-600 font-bold underline text-base">顯示全部</button>
      </div>
      <div class="space-y-3">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">九龍區</span>
          <div class="flex flex-wrap gap-2" id="kowloonDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">港島區</span>
          <div class="flex flex-wrap gap-2" id="hkIslandDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">新界區</span>
          <div class="flex flex-wrap gap-2" id="ntDistricts"></div>
        </div>
      </div>
    </section>

    <!-- 租盤標題與計數 -->
    <div class="flex justify-between items-end border-b-2 border-slate-300 pb-2">
      <h3 class="text-xl font-black text-slate-800" id="currentFilterText">所有最新租盤</h3>
      <span class="text-slate-500 font-bold" id="listingCount">共 0 個租盤</span>
    </div>

    <!-- 租盤列表容器 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="listingsContainer">
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
        <p>正在載入最新租盤...</p>
      </div>
    </div>
  </main>

  <!-- 免費放盤 彈出視窗 (Modal) -->
  <div id="postModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-blue-600">
      <button onclick="closePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-3xl font-black px-3 py-1">✕</button>

      <h2 class="text-2xl font-black text-blue-700 mb-1"><i class="fa-solid fa-house-medical mr-2"></i>免費業主放盤</h2>
      <p class="text-slate-500 text-sm mb-4">無需填寫個人資料，填寫單位簡單資料即可發布。</p>

      <form id="listingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="bg-slate-50 p-3 rounded-xl border-2 border-dashed border-slate-300">
          <label class="block font-black text-slate-700 mb-1">1. 單位圖片網址 (選填)</label>
          <input type="url" id="imageUrlInput" placeholder="https://example.com/photo.jpg" class="w-full p-2.5 border rounded-lg font-bold text-sm">
        </div>

        <div>
          <label class="block font-black text-slate-700 mb-1">2. 每月租金 (HKD)</label>
          <input type="number" id="priceInput" required placeholder="例如：12000" class="w-full p-3 border-2 border-slate-300 rounded-xl text-xl font-bold focus:border-blue-600 outline-none">
        </div>

        <div>
          <label class="block font-black text-slate-700 mb-1">3. 地區 (香港十八區)</label>
          <select id="districtInput" required class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold bg-white focus:border-blue-600 outline-none"></select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block font-black text-slate-700">4. 詳細地址</label>
            <button type="button" onclick="useGPS()" class="text-sm bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded-lg border border-emerald-300 flex items-center gap-1">
              <i class="fa-solid fa-location-crosshairs"></i> GPS定位
            </button>
          </div>
          <input type="text" id="addressInput" required placeholder="例如：彌敦道688號旺角中心高層" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold focus:border-blue-600 outline-none">
        </div>

        <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 space-y-3">
          <span class="block font-black text-blue-900">5. 業主聯絡方式 (至少填一項)</span>
          <div>
            <label class="text-sm font-bold text-slate-600">電話 / WhatsApp (+852)</label>
            <input type="tel" id="phoneInput" placeholder="例如：91234567" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
          <div>
            <label class="text-sm font-bold text-slate-600">微信號 (WeChat ID)</label>
            <input type="text" id="wechatInput" placeholder="例如：hk_landlord_99" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition">
          🚀 即時發布出租單位
        </button>
      </form>
    </div>
  </div>

  <!-- 頁尾 Footer -->
  <footer class="bg-slate-800 text-slate-400 p-6 text-center text-base mt-auto space-y-1">
    <p>🏠 香港極簡免登記租屋網 &copy; 2026</p>
    <p class="text-xs text-slate-500">本平台所有盤源維護 30 天效期，免手續費免登記。</p>
  </footer>

  <script>
    // 使用現有打通的 Supabase 設定
    var SUPABASE_URL = "https://bvoqwjtvhlpmbigowghp.supabase.co";
    var SUPABASE_KEY = "sb_publishable_IXkN9Thl9EjlyVFEoNaP2w_4eCNP8Xr";

    const districtsData = {
      kowloon: ["油尖旺", "深水埗", "九龍城", "黃大仙", "觀塘"],
      hkIsland: ["中西區", "灣仔", "東區", "南區"],
      nt: ["荃灣", "屯門", "元朗", "北區", "大埔", "沙田", "西貢", "葵青", "離島"]
    };

    const transportData = {
      "油尖旺": { mtr: "港鐵旺角站 / 尖沙咀站 / 油麻地站", bus: "九巴 1, 1A, 2, 6, 9, 234X" },
      "深水埗": { mtr: "港鐵深水埗站 C2 出口 / 長沙灣站", bus: "九巴 2, 6F, 30X, 214, 城巴 E21" },
      "九龍城": { mtr: "港鐵宋皇臺站 B2 出口 / 土瓜灣站", bus: "九巴 1A, 2A, 11X, 107" },
      "黃大仙": { mtr: "港鐵黃大仙站 / 鑽石山站", bus: "九巴 2F, 3C, 11, 85M" },
      "觀塘": { mtr: "港鐵觀塘站 A2 出口 / 牛頭角站", bus: "九巴 1A, 14, 16, 89D, 215X" },
      "中西區": { mtr: "港鐵中環站 / 上環站 / 香港大學站", bus: "城巴 1, 5B, 7, 10, 90B" },
      "灣仔": { mtr: "港鐵灣仔站 A1 出口 / 銅鑼灣站", bus: "城巴 1, 2, 8, 10, 72" },
      "東區": { mtr: "港鐵太古站 / 北角站 / 筲箕灣站", bus: "城巴 2, 18, 77, 102, 608" },
      "南區": { mtr: "港鐵黃竹坑站 / 海洋公園站", bus: "城巴 7, 37A, 70, 90, 97" },
      "荃灣": { mtr: "港鐵荃灣站 A1 出口 / 荃灣西站", bus: "九巴 30X, 43X, 48X, 238M" },
      "屯門": { mtr: "港鐵屯門站 / 兆康站 (輕鐵網絡)", bus: "九巴 58M, 60M, 960, 961" },
      "元朗": { mtr: "港鐵元朗站 B 出口 / 朗屏站", bus: "九巴 68M, 268C, 968, B1" },
      "北區": { mtr: "港鐵上水站 / 粉嶺站", bus: "九巴 73K, 78K, 277X, 278X" },
      "大埔": { mtr: "港鐵大埔墟站 A 出口 / 太和站", bus: "九巴 71A, 72X, 73X, 271" },
      "沙田": { mtr: "港鐵沙田站 A3 出口 / 大圍站", bus: "九巴 47X, 80, 81, 88K, 280X" },
      "西貢": { mtr: "港鐵坑口站 / 將軍澳站 / 調景嶺站", bus: "九巴 92, 99, 299X, 新巴 792M" },
      "葵青": { mtr: "港鐵葵芳站 / 葵興站 / 青衣站", bus: "九巴 31M, 37, 42A, 249M" },
      "離島": { mtr: "港鐵東涌站 / 機場快綫", bus: "嶼巴 37, 38, A35, E36A" }
    };

    let allListings = [];
    let currentDistrictFilter = 'ALL';

    window.addEventListener('DOMContentLoaded', () => {
      renderDistrictButtons();
      populateDistrictSelect();
      loadListings();
    });

    function changeFontSize(size) {
      const body = document.getElementById('appBody');
      body.classList.remove('font-size-md', 'font-size-lg', 'font-size-xl');
      body.classList.add(`font-size-${size}`);

      document.getElementById('btn-md').className = "px-2.5 py-1 rounded font-bold hover:bg-blue-600";
      document.getElementById('btn-lg').className = "px-2.5 py-1 rounded font-bold hover:bg-blue-600";
      document.getElementById('btn-xl').className = "px-2.5 py-1 rounded font-bold hover:bg-blue-600";
      document.getElementById(`btn-${size}`).className = "px-2.5 py-1 bg-white text-blue-700 rounded font-bold";
    }

    function renderDistrictButtons() {
      const createBtn = d => `<button onclick="filterByDistrict('${d}')" class="district-btn px-3 py-2 bg-slate-200 hover:bg-blue-600 hover:text-white rounded-xl font-bold text-sm sm:text-base transition">${d}</button>`;
      document.getElementById('kowloonDistricts').innerHTML = districtsData.kowloon.map(createBtn).join('');
      document.getElementById('hkIslandDistricts').innerHTML = districtsData.hkIsland.map(createBtn).join('');
      document.getElementById('ntDistricts').innerHTML = districtsData.nt.map(createBtn).join('');
    }

    function populateDistrictSelect() {
      const select = document.getElementById('districtInput');
      const allDistricts = [...districtsData.kowloon, ...districtsData.hkIsland, ...districtsData.nt];
      select.innerHTML = allDistricts.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i><p>載入中...</p></div>`;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        allListings = await response.json();
        renderListings();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-bold">無法載入租盤數據，請重新整理頁面。</div>`;
        document.getElementById('listingCount').innerText = "共 0 個租盤";
      }
    }

    function renderListings() {
      const container = document.getElementById('listingsContainer');
      let data = allListings;

      if (currentDistrictFilter !== 'ALL') {
        data = allListings.filter(item => item.district === currentDistrictFilter);
      }

      document.getElementById('listingCount').innerText = `共 ${data.length} 個租盤`;
      document.getElementById('currentFilterText').innerText = currentDistrictFilter === 'ALL' ? '所有最新租盤' : `${currentDistrictFilter}區 租盤`;

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold">該區暫時未有業主放盤。</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const defaultImg = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80";
        const imgUrl = item.image_url || defaultImg;
        const transportMtr = item.transport_mtr || (transportData[item.district] ? transportData[item.district].mtr : '鄰近主要港鐵站');
        const transportBus = item.transport_bus || (transportData[item.district] ? transportData[item.district].bus : '附近有多條主要巴士路線');

        return `
          <div class="bg-white rounded-3xl overflow-hidden shadow-md border border-slate-200 flex flex-col justify-between">
            <div>
              <div class="relative h-56 bg-slate-200">
                <img src="${imgUrl}" alt="租盤圖片" class="w-full h-full object-cover">
                <span class="absolute top-3 left-3 bg-blue-700 text-white font-black px-3 py-1 rounded-xl text-base shadow">${item.district || '香港區'}</span>
                <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white font-bold px-2 py-1 rounded-lg text-xs">30天效期</span>
              </div>
              <div class="p-4 space-y-3">
                <span class="text-3xl font-black text-amber-600">HK$ ${Number(item.price || 0).toLocaleString()} <span class="text-base font-normal text-slate-500">/月</span></span>
                <h4 class="text-xl font-black text-slate-900 leading-snug"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${item.address || '詳細地址請查詢'}</h4>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm space-y-1">
                  <div class="text-slate-700 font-bold flex items-center gap-1"><i class="fa-solid fa-train-subway text-blue-600"></i><span>${transportMtr}</span></div>
                  <div class="text-slate-500 text-xs flex items-center gap-1"><i class="fa-solid fa-bus text-emerald-600"></i><span>${transportBus}</span></div>
                </div>
              </div>
            </div>
            <div class="p-4 pt-0 space-y-2">
              <div class="grid grid-cols-2 gap-2">
                ${item.phone ? `<a href="https://wa.me/852${item.phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent('你好，我在香港租屋網看到你的租盤：' + item.address)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1"><i class="fa-brands fa-whatsapp text-xl"></i> WhatsApp</a>` : ''}
                ${item.wechat_id ? `<button onclick="copyWeChat('${item.wechat_id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1"><i class="fa-brands fa-weixin text-xl"></i> 微信號</button>` : `<a href="tel:${item.phone}" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1"><i class="fa-solid fa-phone text-lg"></i> 致電業主</a>`}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterByDistrict(district) {
      currentDistrictFilter = district;
      renderListings();
    }

    function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
    function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

    function useGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => { document.getElementById('addressInput').value = "香港旺角彌敦道附近 (GPS已定位)"; alert("已成功透過 GPS 取得大致位置！"); },
          err => { document.getElementById('addressInput').value = "香港油尖旺區"; alert("無法自動獲取定位，已填入基礎區域。"); }
        );
      } else { alert("瀏覽器不支援 GPS 定位"); }
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 發布中，請稍候...";

      try {
        const districtVal = document.getElementById('districtInput').value;
        const transportInfo = transportData[districtVal] || { mtr: "鄰近主要鐵路站", bus: "附近有多條巴士線" };

        const newListing = {
          district: districtVal,
          address: document.getElementById('addressInput').value,
          price: Number(document.getElementById('priceInput').value),
          image_url: document.getElementById('imageUrlInput').value || null,
          phone: document.getElementById('phoneInput').value || null,
          wechat_id: document.getElementById('wechatInput').value || null,
          transport_mtr: transportInfo.mtr,
          transport_bus: transportInfo.bus
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(newListing)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }

        alert("🎉 租盤發布成功！全網用戶現已可瀏覽。");
        document.getElementById('listingForm').reset();
        closePostModal();
        loadListings();
      } catch (err) {
        console.error(err);
        alert("發布失敗：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 即時發布出租單位";
      }
    }

    function copyWeChat(id) {
      navigator.clipboard.writeText(id);
      alert(`已複製業主微信號：${id}`);
    }
  </script>
</body>
</html>
