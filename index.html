<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港極簡免登記租屋網 - 大字版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-size: 18px; }
    .font-size-sm { font-size: 16px; }
    .font-size-md { font-size: 18px; }
    .font-size-lg { font-size: 22px; }
    .font-size-xl { font-size: 26px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col font-size-md" id="appBody">

  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-black tracking-wide cursor-pointer" onclick="filterByDistrict('ALL')">
        🏠 香港簡單租屋網

      <div class="flex items-center space-x-1 bg-blue-800 p-1 rounded-lg text-sm">
        <span class="px-2 text-slate-200">字體:</span>
        <button onclick="changeFontSize('md')" class="px-2 py-1 bg-blue-600 rounded font-bold">中</button>
        <button onclick="changeFontSize('lg')" class="px-2 py-1 bg-blue-600 rounded font-bold">大</button>
        <button onclick="changeFontSize('xl')" class="px-2 py-1 bg-blue-600 rounded font-bold">特大</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-3 md:p-6 flex-grow space-y-6">
    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="openPostModal()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-4 px-6 rounded-2xl shadow-lg text-xl flex items-center justify-center space-x-2 border-2 border-amber-400 active:scale-95 transition">
        <i class="fa-solid fa-circle-plus text-2xl"></i>
        <span>我要免費放盤 (免登記)</span>
      </button>
    </div>

    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">

        <h2 class="text-xl font-black text-slate-800"><i class="fa-solid fa-location-dot text-blue-600 mr-2"></i>選擇香港區域</h2>
        <button onclick="filterByDistrict('ALL')" class="text-blue-600 font-bold underline text-base">顯示全部</button>
      </div>
      <div class="space-y-3">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">九龍區</span>
          <div class="flex flex-wrap gap-2" id="kowloonDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">港島區</span>
          <div class="flex flex-wrap gap-2" id="hkIslandDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">新界區</span>
          <div class="flex flex-wrap gap-2" id="ntDistricts"></div>
        </div>
      </div>
    </section>

    <div class="flex justify-between items-end border-b-2 border-slate-300 pb-2">
      <h3 class="text-xl font-black text-slate-800" id="currentFilterText">所有最新租盤</h3>
      <span class="text-slate-500 font-bold" id="listingCount">共 0 個租盤</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="listingsContainer">
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
        <p>正在載入最新租盤...</p>
      </div>
    </div>
  </main>

  <div id="postModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-blue-600">
      <button onclick="closePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-3xl font-black px-3 py-1">✕</button>

      <h2 class="text-2xl font-black text-blue-700 mb-1"><i class="fa-solid fa-house-medical mr-2"></i>免費業主放盤</h2>
      <p class="text-slate-500 text-sm mb-4">無需填寫個人資料，填寫單位簡單資料即可發布。</p>

      <form id="listingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="bg-slate-50 p-3 rounded-xl border-2 border-dashed border-slate-300">
          <label class="block font-black text-slate-700 mb-1">1. 上傳單位圖片 (必填)</label>
          <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="w-full text-base text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 file:text-base file:font-black file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          <div id="imagePreviewContainer" class="mt-2 hidden">
            <img id="imagePreview" class="h-40 w-full object-cover rounded-xl border">
          </div>
        </div>

        <div>
          <label class="block font-black text-slate-700 mb-1">2. 每月租金 (HKD)</label>
          <input type="number" id="priceInput" required placeholder="例如：12000" class="w-full p-3 border-2 border-slate-300 rounded-xl text-xl font-bold focus:border-blue-600 outline-none">
        </div>

        <div>
          <label class="block font-black text-slate-700 mb-1">3. 地區 (香港十八區)</label>
          <select id="districtInput" required class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold bg-white focus:border-blue-600 outline-none"></select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block font-black text-slate-700">4. 詳細地址</label>
            <button type="button" onclick="useGPS()" class="text-sm bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded-lg border border-emerald-300 flex items-center gap-1">
              <i class="fa-solid fa-location-crosshairs"></i> GPS定位
            </button>
          </div>
          <input type="text" id="addressInput" required placeholder="例如：彌敦道688號旺角中心高層" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold focus:border-blue-600 outline-none">
        </div>

        <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 space-y-3">
          <span class="block font-black text-blue-900">5. 業主聯絡方式 (至少填一項)</span>
          <div>
            <label class="text-sm font-bold text-slate-600">電話 / WhatsApp (+852 或 +86)</label>
            <input type="tel" id="phoneInput" placeholder="例如：91234567" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
          <div>
            <label class="text-sm font-bold text-slate-600">微信號 (WeChat ID)</label>
            <input type="text" id="wechatInput" placeholder="例如：hk_landlord_99" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition">
          🚀 即時發布出租單位
        </button>
      </form>
    </div>
  </div>

  <footer class="bg-slate-800 text-slate-400 p-6 text-center text-base mt-auto">
    <p>🏠 香港極簡免登記租屋網 &copy; 2026</p>
    <p class="text-xs mt-1 text-slate-500">本平台所有盤源維護 30 天效期，免手續費免登記。</p>
  </footer>
