<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港極簡免登記租屋網 - 大字版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-size: 18px; /* 長者預設大字體 base */
    }
    .font-size-sm { font-size: 16px; }
    .font-size-md { font-size: 18px; }
    .font-size-lg { font-size: 22px; }
    .font-size-xl { font-size: 26px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col font-size-md" id="appBody">

  <!-- 頂部標題與字體選擇器 -->
  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-black tracking-wide cursor-pointer" onclick="filterByDistrict('ALL')">
        🏠 香港簡單租屋網
      </h1>
      <!-- 字體切換 -->
      <div class="flex items-center space-x-1 bg-blue-800 p-1 rounded-lg text-sm">
        <span class="px-2 text-slate-200">字體:</span>
        <button onclick="changeFontSize('md')" class="px-2 py-1 bg-blue-600 rounded font-bold">中</button>
        <button onclick="changeFontSize('lg')" class="px-2 py-1 bg-blue-600 rounded font-bold">大</button>
        <button onclick="changeFontSize('xl')" class="px-2 py-1 bg-blue-600 rounded font-bold">特大</button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto w-full p-3 md:p-6 flex-grow space-y-6">

    <!-- 頂部按鈕區 -->
    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="openPostModal()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-4 px-6 rounded-2xl shadow-lg text-xl flex items-center justify-center space-x-2 border-2 border-amber-400 active:scale-95 transition">
        <i class="fa-solid fa-circle-plus text-2xl"></i>
        <span>我要免費放盤 (免登記)</span>
      </button>
    </div>

    <!-- 十八區篩選器 (大字塊) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xl font-black text-slate-800"><i class="fa-solid fa-location-dot text-blue-600 mr-2"></i>選擇香港區域</h2>
        <button onclick="filterByDistrict('ALL')" class="text-blue-600 font-bold underline text-base">顯示全部</button>
      </div>

      <!-- 區域分組 -->
      <div class="space-y-3">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">九龍區</span>
          <div class="flex flex-wrap gap-2" id="kowloonDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">港島區</span>
          <div class="flex flex-wrap gap-2" id="hkIslandDistricts"></div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">新界區</span>
          <div class="flex flex-wrap gap-2" id="ntDistricts"></div>
        </div>
      </div>
    </section>

    <!-- 當前篩選標題 -->
    <div class="flex justify-between items-end border-b-2 border-slate-300 pb-2">
      <h3 class="text-xl font-black text-slate-800" id="currentFilterText">所有最新租盤</h3>
      <span class="text-slate-500 font-bold" id="listingCount">共 0 個租盤</span>
    </div>

    <!-- 租盤列表卡片容器 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="listingsContainer">
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
        <p>正在載入最新租盤...</p>
      </div>
    </div>
  </main>

  <!-- 發布租盤彈窗 Modal (極簡流程) -->
  <div id="postModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-blue-600">
      <button onclick="closePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-3xl font-black px-3 py-1">✕</button>

      <h2 class="text-2xl font-black text-blue-700 mb-1"><i class="fa-solid fa-house-medical mr-2"></i>免費業主放盤</h2>
      <p class="text-slate-500 text-sm mb-4">無需填寫個人個人資料，填寫單位簡單資料即可發布。</p>

      <form id="listingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <!-- 圖片上傳 -->
        <div class="bg-slate-50 p-3 rounded-xl border-2 border-dashed border-slate-300">
          <label class="block font-black text-slate-700 mb-1">1. 上傳單位圖片 (必填)</label>
          <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="w-full text-base text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 file:text-base file:font-black file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          <div id="imagePreviewContainer" class="mt-2 hidden">
            <img id="imagePreview" class="h-40 w-full object-cover rounded-xl border">
          </div>
        </div>

        <!-- 租金 -->
        <div>
          <label class="block font-black text-slate-700 mb-1">2. 每月租金 (HKD)</label>
          <input type="number" id="priceInput" required placeholder="例如：12000" class="w-full p-3 border-2 border-slate-300 rounded-xl text-xl font-bold focus:border-blue-600 outline-none">
        </div>

        <!-- 地區選擇 -->
        <div>
          <label class="block font-black text-slate-700 mb-1">3. 地區 (香港十八區)</label>
          <select id="districtInput" required class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold bg-white focus:border-blue-600 outline-none">
            <!-- JS 動態生成 -->
          </select>
        </div>

        <!-- 詳細地址與 GPS 定位 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block font-black text-slate-700">4. 詳細地址</label>
            <button type="button" onclick="useGPS()" class="text-sm bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded-lg border border-emerald-300 flex items-center gap-1">
              <i class="fa-solid fa-location-crosshairs"></i> GPS定位
            </button>
          </div>
          <input type="text" id="addressInput" required placeholder="例如：彌敦道688號旺角中心高層" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg font-bold focus:border-blue-600 outline-none">
        </div>

        <!-- 聯絡資料 (電話 / 微信號) -->
        <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 space-y-3">
          <span class="block font-black text-blue-900">5. 業主聯絡方式 (至少填一項)</span>
          <div>
            <label class="text-sm font-bold text-slate-600">電話 / WhatsApp (+852 或 +86)</label>
            <input type="tel" id="phoneInput" placeholder="例如：91234567" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
          <div>
            <label class="text-sm font-bold text-slate-600">微信號 (WeChat ID)</label>
            <input type="text" id="wechatInput" placeholder="例如：hk_landlord_99" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition">
          🚀 即時發布出租單位
        </button>
      </form>
    </div>
  </div>

  <footer class="bg-slate-800 text-slate-400 p-6 text-center text-base mt-auto">
    <p>🏠 香港極簡免登記租屋網 &copy; 2026</p>
    <p class="text-xs mt-1 text-slate-500">本平台所有盤源維護 30 天效期，免手續費免登記。</p>
  </footer>

  <script>
    // --- 1. Supabase 連線設定 ---
    const SUPABASE_URL = "https://dfzyweiypnho.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Znl3ZWl5cG5ob2RjZmZ1c3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU0ODAsImV4cCI6MjEwODg0MTQ4MH0.4IGm5K2N9RDr_RAO6STivC9E6_HxlLyMg6tCzTS6zEg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- 2. 香港十八區資料與交通數據對應庫 ---
    const districtsData = {
      kowloon: ["油尖旺", "深水埗", "九龍城", "黃大仙", "觀塘"],
      hkIsland: ["中西區", "灣仔", "東區", "南區"],
      nt: ["荃灣", "屯門", "元朗", "北區", "大埔", "沙田", "西貢", "葵青", "離島"]
    };

    const transportData = {
      "油尖旺": { mtr: "港鐵旺角站 / 尖沙咀站 / 油麻地站", bus: "九巴 1, 1A, 2, 6, 9, 234X" },
      "深水埗": { mtr: "港鐵深水埗站 C2 出口 / 長沙灣站", bus: "九巴 2, 6F, 30X, 214, 城巴 E21" },
      "九龍城": { mtr: "港鐵宋皇臺站 B2 出口 / 土瓜灣站", bus: "九巴 1A, 2A, 11X, 107" },
      "黃大仙": { mtr: "港鐵黃大仙站 / 鑽石山站", bus: "九巴 2F, 3C, 11, 85M" },
      "觀塘": { mtr: "港鐵觀塘站 A2 出口 / 牛頭角站", bus: "九巴 1A, 14, 16, 89D, 215X" },
      "中西區": { mtr: "港鐵中環站 / 上環站 / 香港大學站", bus: "城巴 1, 5B, 7, 10, 90B" },
      "灣仔": { mtr: "港鐵灣仔站 A1 出口 / 銅鑼灣站", bus: "城巴 1, 2, 8, 10, 72" },
      "東區": { mtr: "港鐵太古站 / 北角站 / 筲箕灣站", bus: "城巴 2, 18, 77, 102, 608" },
      "南區": { mtr: "港鐵黃竹坑站 / 海洋公園站", bus: "城巴 7, 37A, 70, 90, 97" },
      "荃灣": { mtr: "港鐵荃灣站 A1 出口 / 荃灣西站", bus: "九巴 30X, 43X, 48X, 238M" },
      "屯門": { mtr: "港鐵屯門站 / 兆康站 (輕鐵網絡)", bus: "九巴 58M, 60M, 960, 961" },
      "元朗": { mtr: "港鐵元朗站 B 出口 / 朗屏站", bus: "九巴 68M, 268C, 968, B1" },
      "北區": { mtr: "港鐵上水站 / 粉嶺站", bus: "九巴 73K, 78K, 277X, 278X" },
      "大埔": { mtr: "港鐵大埔墟站 A 出口 / 太和站", bus: "九巴 71A, 72X, 73X, 271" },
      "沙田": { mtr: "港鐵沙田站 A3 出口 / 大圍站", bus: "九巴 47X, 80, 81, 88K, 280X" },
      "西貢": { mtr: "港鐵坑口站 / 將軍澳站 / 調景嶺站", bus: "九巴 92, 99, 299X, 新巴 792M" },
      "葵青": { mtr: "港鐵葵芳站 / 葵興站 / 青衣站", bus: "九巴 31M, 37, 42A, 249M" },
      "離島": { mtr: "港鐵東涌站 / 機場快綫", bus: "嶼巴 37, 38, A35, E36A" }
    };

    let currentDistrictFilter = 'ALL';

    // --- 3. 初始化頁面區塊 ---
    window.addEventListener('DOMContentLoaded', () => {
      renderDistrictButtons();
      populateDistrictSelect();
      loadListings();
    });

    // 改變字體大小
    function changeFontSize(size) {
      const body = document.getElementById('appBody');
      body.classList.remove('font-size-md', 'font-size-lg', 'font-size-xl');
      body.classList.add(`font-size-${size}`);
    }

    // 渲染十八區按鈕
    function renderDistrictButtons() {
      const createBtn = d => `<button onclick="filterByDistrict('${d}')" class="district-btn px-3 py-2 bg-slate-200 hover:bg-blue-600 hover:text-white rounded-xl font-bold text-sm sm:text-base transition">${d}</button>`;
      
      document.getElementById('kowloonDistricts').innerHTML = districtsData.kowloon.map(createBtn).join('');
      document.getElementById('hkIslandDistricts').innerHTML = districtsData.hkIsland.map(createBtn).join('');
      document.getElementById('ntDistricts').innerHTML = districtsData.nt.map(createBtn).join('');
    }

    // 填寫放盤選單的地區選項
    function populateDistrictSelect() {
      const select = document.getElementById('districtInput');
      const allDistricts = [...districtsData.kowloon, ...districtsData.hkIsland, ...districtsData.nt];
      select.innerHTML = allDistricts.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    // --- 4. 讀取與渲染 Supabase 租盤 ---
    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i><p>載入中...</p></div>`;

      let query = supabaseClient.from('listings').select('*').order('created_at', { ascending: false });
      
      if (currentDistrictFilter !== 'ALL') {
        query = query.eq('district', currentDistrictFilter);
      }

      const { data, error } = await query;

      if (error) {
        console.error(error);
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-bold">無法載入租盤數據，請重新整理頁面。</div>`;
        return;
      }

      document.getElementById('listingCount').innerText = `共 ${data.length} 個租盤`;
      document.getElementById('currentFilterText').innerText = currentDistrictFilter === 'ALL' ? '所有最新租盤' : `${currentDistrictFilter}區 租盤`;

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold">該區暫時未有業主放盤。</div>`;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="bg-white rounded-3xl overflow-hidden shadow-md border border-slate-200 flex flex-col justify-between">
          <div>
            <div class="relative h-56 bg-slate-200">
              <img src="${item.image_url}" alt="租盤圖片" class="w-full h-full object-cover">
              <span class="absolute top-3 left-3 bg-blue-700 text-white font-black px-3 py-1 rounded-xl text-base shadow">
                ${item.district}
              </span>
              <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white font-bold px-2 py-1 rounded-lg text-xs">
                30天效期
              </span>
            </div>

            <div class="p-4 space-y-3">
              <div class="flex justify-between items-baseline">
                <span class="text-3xl font-black text-amber-600">HK$ ${Number(item.price).toLocaleString()} <span class="text-base font-normal text-slate-500">/月</span></span>
              </div>
              <h4 class="text-xl font-black text-slate-900 leading-snug"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${item.address}</h4>
              
              <!-- 系統自動補上交通資訊 -->
              <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm space-y-1">
                <div class="text-slate-700 font-bold flex items-center gap-1">
                  <i class="fa-solid fa-train-subway text-blue-600"></i>
                  <span>${item.transport_mtr || '鄰近交通節點'}</span>
                </div>
                <div class="text-slate-500 text-xs flex items-center gap-1">
                  <i class="fa-solid fa-bus text-emerald-600"></i>
                  <span>${item.transport_bus || '附近設有多條主要巴士路線'}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 聯絡與分享按鈕 -->
          <div class="p-4 pt-0 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              ${item.phone ? `
                <a href="https://wa.me/${item.phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent('你好，我在香港租屋網看到你的租盤：' + item.address)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1">
                  <i class="fa-brands fa-whatsapp text-xl"></i> WhatsApp
                </a>
              ` : ''}
              ${item.wechat_id ? `
                <button onclick="copyWeChat('${item.wechat_id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1">
                  <i class="fa-brands fa-weixin text-xl"></i> 微信號
                </button>
              ` : ''}
            </div>

            <div class="flex gap-2 text-xs pt-2 border-t">
              <button onclick="shareListing('${item.address}', ${item.price})" class="flex-1 text-slate-500 font-bold hover:text-blue-600 py-1 flex items-center justify-center gap-1">
                <i class="fa-solid fa-share-nodes"></i> 分享此盤
              </button>
              <button onclick="reportListing(${item.id})" class="text-slate-400 font-bold hover:text-red-500 py-1 flex items-center justify-center gap-1">
                <i class="fa-solid fa-triangle-exclamation"></i> 舉報
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 按地區篩選
    function filterByDistrict(district) {
      currentDistrictFilter = district;
      loadListings();
    }

    // --- 5. Modal 控制與上傳發布邏輯 ---
    function openPostModal() {
      document.getElementById('postModal').classList.remove('hidden');
    }

    function closePostModal() {
      document.getElementById('postModal').classList.add('hidden');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // 模擬 GPS 定位帶出地址
    function useGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            document.getElementById('addressInput').value = "香港旺角彌敦道附近 (GPS已定位)";
            alert("已成功透過 GPS 取得大致位置！請補全詳細大廈/單位號碼。");
          },
          err => {
            document.getElementById('addressInput').value = "香港油尖旺區";
            alert("無法自動獲取權限，已填入基礎區域。");
          }
        );
      } else {
        alert("瀏覽器不支援 GPS 定位");
      }
    }

    // 表單提交寫入 Supabase
    async function handleFormSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 發布中，請稍候...";

      try {
        const imageFile = document.getElementById('imageInput').files[0];
        let imageUrl = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80"; // 預設圖

        // 1. 如果業主有選擇相片，上載至 rent-images Bucket
        if (imageFile) {
          const fileExt = imageFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
          
          const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('rent-images')
            .upload(fileName, imageFile);

          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabaseClient.storage
            .from('rent-images')
            .getPublicUrl(fileName);

          imageUrl = publicUrlData.publicUrl;
        }

        // 2. 自動匹配最近的交通資訊
        const districtVal = document.getElementById('districtInput').value;
        const transportInfo = transportData[districtVal] || { mtr: "鄰近主要鐵路站", bus: "附近有多條巴士線" };

        // 3. 寫入 listings 資料庫
        const newListing = {
          district: districtVal,
          address: document.getElementById('addressInput').value,
          price: Number(document.getElementById('priceInput').value),
          image_url: imageUrl,
          phone: document.getElementById('phoneInput').value || null,
          wechat_id: document.getElementById('wechatInput').value || null,
          transport_mtr: transportInfo.mtr,
          transport_bus: transportInfo.bus
        };

        const { error: insertError } = await supabaseClient.from('listings').insert([newListing]);

        if (insertError) throw insertError;

        alert("🎉 租盤發布成功！全網用戶現已可瀏覽。");
        document.getElementById('listingForm').reset();
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        closePostModal();
        loadListings(); // 重新讀取

      } catch (err) {
        console.error(err);
        alert("發布失敗：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 即時發布出租單位";
      }
    }

    // 複製微信號工具
    function copyWeChat(id) {
      navigator.clipboard.writeText(id);
      alert(`已複製業主微信號：${id}\n請打開微信搜尋並加為好友。`);
    }

    // 分享工具
    function shareListing(address, price) {
      const shareText = `【香港租盤分享】${address}，租金：HK$ ${price}/月。快來看看！`;
      if (navigator.share) {
        navigator.share({ title: '香港簡單租屋網', text: shareText, url: window.location.href });
      } else {
        navigator.clipboard.writeText(shareText + " " + window.location.href);
        alert("租盤連結及簡介已複製到剪貼簿，可直接貼上分享至 WhatsApp 或微信！");
      }
    }

    // 舉報工具
    async function reportListing(id) {
      if (confirm("確定舉報此租盤？如該單位已租出或包含虛假資訊，我們將會在核驗後隱藏。")) {
        alert("感謝舉報，系統已記錄該要求。");
      }
    }
  </script>
</body>
</html>
