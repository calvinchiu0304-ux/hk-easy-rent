<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港極簡免登記租屋網 - 測試版</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 font-sans">
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md space-y-4 text-center">
    <h1 class="text-2xl font-black text-blue-700">🔧 Supabase 連線測試</h1>
    <p class="text-slate-600 text-sm">點擊下方按鈕，直接檢測資料庫有沒有回應：</p>
    
    <button onclick="testConnection()" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl shadow">
      立即測試資料庫連線
    </button>

    <div id="resultBox" class="bg-slate-50 p-4 rounded-xl text-left text-xs font-mono border overflow-x-auto hidden">
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bvoqwjtvhlpmbigowghp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_c54wb1f6a1d4715fba393a54ccff2842e1f468202534571";

    async function testConnection() {
      const box = document.getElementById('resultBox');
      box.classList.remove('hidden');
      box.innerHTML = "⏳ 正在連線中...";

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        
        const text = await res.text();
        box.innerHTML = `<b>HTTP 狀態碼:</b> ${res.status} ${res.statusText}<br><br><b>回應內容:</b><br>${text}`;
      } catch (err) {
        box.innerHTML = `<span style="color:red;">連線發生例外錯誤：${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
