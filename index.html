        <div>
          <label class="block font-black text-slate-800 mb-1">4. 選擇區域 / 城市</label>

        <div class="bg-blue-50/70 p-3.5 rounded-2xl border border-blue-200 space-y-3">

          </div>
          <div>
            <label class="text-sm font-bold text-slate-700">微信號 (WeChat ID) / 通訊軟體</label>
            <input type="text" id="wechatInput" placeholder="例如：hk_landlord_99" class="w-full p-2.5 border rounded-xl font-bold outline-none focus:border-blue-600">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition">
          🚀 確認發布單位

  <footer class="bg-slate-900 text-slate-300 p-6 text-center text-base mt-auto space-y-1.5 border-t border-slate-800">

  <script>
    var SUPABASE_URL = "https://bvoqwjtvhlpmbigowghp.supabase.co";
    var SUPABASE_KEY = "sb_publishable_IXkN9Thl9EjlyVFEoNaP2w_4eCNP8Xr";

    const districtsData = {
      kowloon: ["油尖旺", "深水埗", "九龍城", "黃大仙", "觀塘"],
      hkIsland: ["中西區", "灣仔", "東區", "南區"],

    const defaultDistrictTransport = {

      "九龍城": { mtr: "港鐵宋皇臺站 / 土瓜灣站", bus: "九巴 1A, 2A, 11X", china: "直達跨境巴總站" },
      "黃大仙": { mtr: "港鐵黃大仙站 / 鑽石山站", bus: "九巴 2F, 3C, 11", china: "鑽石山高鐵接駁專線" },
      "觀塘": { mtr: "港鐵觀塘站 / 牛頭角站", bus: "九巴 1A, 14, 16", china: "觀塘跨境直通巴總站" },
      "中西區": { mtr: "港鐵中環站 / 上環站", bus: "城巴 1, 5B, 7", china: "港澳碼頭跨境船" },
      "灣仔": { mtr: "港鐵灣仔站 / 銅鑼灣站", bus: "城巴 1, 2, 8", china: "灣仔跨境直通巴總站" },
      "東區": { mtr: "港鐵太古站 / 北角站", bus: "城巴 2, 18, 77", china: "北角碼頭直通巴專線" },
      "南區": { mtr: "港鐵黃竹坑站 / 海洋公園站", bus: "城巴 7, 37A, 70", china: "經香港仔隧道快捷前往" },
      "荃灣": { mtr: "港鐵荃灣站 / 荃灣西站", bus: "九巴 30X, 43X, 48X", china: "荃灣皇崗直通巴總站" },
      "屯門": { mtr: "港鐵屯門站 / 兆康站", bus: "九巴 58M, 60M, 960", china: "深圳灣口岸直達" },
      "元朗": { mtr: "港鐵元朗站 / 朗屏站", bus: "九巴 68M, 268C, 968", china: "福田口岸直達" },
      "北區": { mtr: "港鐵上水站 / 粉嶺站", bus: "九巴 73K, 78K, 277X", china: "緊鄰羅湖/落馬洲口岸" },
      "大埔": { mtr: "港鐵大埔墟站 / 太和站", bus: "九巴 71A, 72X, 73X", china: "東鐵線直達羅湖" },
      "沙田": { mtr: "港鐵沙田站 / 大圍站", bus: "九巴 47X, 80, 81", china: "東鐵線直達西九龍站" },
      "西貢": { mtr: "港鐵坑口站 / 將軍澳站", bus: "九巴 92, 99, 299X", china: "將軍澳跨境巴士線" },
      "葵青": { mtr: "港鐵葵芳站 / 青衣站", bus: "九巴 31M, 37, 42A", china: "葵芳跨境巴接駁" },
      "離島": { mtr: "港鐵東涌站 / 機場快綫", bus: "嶼巴 37, 38, A35", china: "港珠澳大橋口岸巴士" },
      "布達佩斯 (海外)": { mtr: "地鐵 M1 / M2 / M3 幹線", bus: "市中心 46/47/49 有軌電車", china: "機場直達巴士 100E" }
    };

    let allListings = [];
    let currentDistrictFilter = 'ALL';
    let uploadedBase64Image = null;
    let addressSearchTimer = null;
    let targetSingleListingId = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderDistrictButtons();
      populateDistrictSelect();
      loadListings();
      bindAddressSearchEvent();
      bindPricePreview();

      // 讀取URL參數，判斷是否要單獨顯示租盤（模式B）
      targetSingleListingId = getUrlParam("listing_id");
    });

    function changeFontSize(size) {
      const body = document.getElementById('appBody');
      body.classList.remove('font-size-md', 'font-size-lg', 'font-size-xl');
      body.classList.add(`font-size-${size}`);

      document.getElementById('btn-md').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById('btn-lg').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById('btn-xl').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById(`btn-${size}`).className = "px-2.5 py-1 bg-white text-blue-900 rounded-lg font-bold shadow-sm";
    }

    function renderDistrictButtons() {
      const createBtn = d => `<button onclick="filterByDistrict('${d}')" class="district-btn px-3 py-1.5 bg-slate-100 hover:bg-blue-700 hover:text-white rounded-xl font-bold text-sm sm:text-base border border-slate-200/80 transition active:scale-95">${d}</button>`;
      document.getElementById('kowloonDistricts').innerHTML = districtsData.kowloon.map(createBtn).join('');
      document.getElementById('hkIslandDistricts').innerHTML = districtsData.hkIsland.map(createBtn).join('');
      document.getElementById('ntDistricts').innerHTML = districtsData.nt.map(createBtn).join('');
    }

    function populateDistrictSelect() {
      const select = document.getElementById('districtInput');
      const allDistricts = [...districtsData.kowloon, ...districtsData.hkIsland, ...districtsData.nt];
      select.innerHTML = allDistricts.map(d => `<option value="${d}">${d}</option>`).join('');
      onDistrictChange();
    }

    function onDistrictChange() {
      const district = document.getElementById('districtInput').value;
      const info = defaultDistrictTransport[district] || { mtr: "鄰近地鐵站", bus: "多條公車路線", china: "交通便利" };
      document.getElementById('transportMtrInput').value = info.mtr;
      document.getElementById('transportBusInput').value = info.bus;
      document.getElementById('transportChinaInput').value = info.china;
    }

    // ========== 香港政府地址API搜尋 ==========
    function bindAddressSearchEvent() {
      const input = document.getElementById('addressSearchInput');
      const suggestBox = document.getElementById('addressSuggestBox');
      input.addEventListener('input', function () {
        if(document.getElementById('isOverseasAddr').checked){
          suggestBox.classList.add('hidden');
          return;
        }
        clearTimeout(addressSearchTimer);
        const kw = this.value.trim();
        suggestBox.innerHTML = '';
        if(kw.length < 2){
          suggestBox.classList.add('hidden');
          return;
        }
        addressSearchTimer = setTimeout(async ()=>{
          try{
            const res = await fetch(`https://geodata.gov.hk/gs/api/v1.0.0/addressSearch?q=${encodeURIComponent(kw)}&lang=tc`);
            if(!res.ok) throw new Error("地址API失敗");
            const json = await res.json();
            if(!json.result || json.result.length === 0){
              suggestBox.innerHTML = `<div class="p-3 text-slate-400 text-sm">找不到對應地址，請嘗試其他關鍵字</div>`;
              suggestBox.classList.remove('hidden');
              return;
            }
            suggestBox.innerHTML = json.result.slice(0,6).map(item=>{
              const fullAddr = item.address;
              const building = item.buildingName || '';
              const street = item.street + (item.streetNo? " "+item.streetNo : "");
              const districtName = item.district;
              const lat = item.lat;
              const lng = item.lng;
              return `
                <div class="address-suggest-item p-2.5 cursor-pointer border-b border-slate-100 text-sm"
                  onclick="selectAddressItem('${escapeHtml(building)}','${escapeHtml(street)}','${escapeHtml(districtName)}')">
                  <div class="font-bold text-slate-800">${escapeHtml(fullAddr)}</div>
                  <div class="text-xs text-slate-500">分區：${escapeHtml(districtName)}</div>
                </div>
              `;
            }).join('');
            suggestBox.classList.remove('hidden');
          }catch(e){
            suggestBox.innerHTML = `<div class="p-3 text-red-400 text-sm">地址服務暫時無法使用，請手動填寫</div>`;
            suggestBox.classList.remove('hidden');
          }
        }, 450);
      })
      // 點畫面其他地方關閉下拉
      document.addEventListener('click', function(ev){
        if(!input.contains(ev.target) && !suggestBox.contains(ev.target)){
          suggestBox.classList.add('hidden');
        }
      })
    }

    function selectAddressItem(building, street, districtName){
      document.getElementById('buildingNameInput').value = building;
      document.getElementById('streetAddressInput').value = street;
      // 自動設定分區
      const sel = document.getElementById('districtInput');
      const opt = Array.from(sel.options).find(o=>o.value === districtName);
      if(opt) sel.value = districtName;
      onDistrictChange();
      document.getElementById('addressSuggestBox').classList.add('hidden');
    }

    function toggleOverseasMode(){
      const isOverseas = document.getElementById('isOverseasAddr').checked;
      const addrSearchInput = document.getElementById('addressSearchInput');
      const suggestBox = document.getElementById('addressSuggestBox');
      if(isOverseas){
        addrSearchInput.disabled = true;
        addrSearchInput.placeholder = "海外地址不使用搜尋，直接在下方手動填寫";
        suggestBox.classList.add('hidden');
      }else{
        addrSearchInput.disabled = false;
        addrSearchInput.placeholder = "輸入屋苑 / 大廈 / 街道，例如：國康大樓";
      }
    }

    function escapeHtml(str){
      if(!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function bindPricePreview(){
      const priceInput = document.getElementById('priceInput');
      priceInput.addEventListener('input', function(){
        const pv = Number(this.value);
        const previewDom = document.getElementById('pricePreview');
        if(pv>0){
          previewDom.innerText = `✅ 每月租金預覽：HK$ ${pv.toLocaleString()} /月`;
        }else{
          previewDom.innerText = '';
        }
      })
    }

    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          uploadedBase64Image = e.target.result;
          document.getElementById('imagePreview').src = uploadedBase64Image;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function openMap(query) {
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      window.open(url, '_blank');
    }

    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-600"></i><p class="font-bold">載入中...</p></div>`;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        allListings = await response.json();
        renderListings();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-bold">無法載入租盤數據，請重新整理頁面。</div>`;
        document.getElementById('listingCount').innerText = "共 0 個租盤";
      }
    }

    function renderListings() {
      const container = document.getElementById('listingsContainer');
      let data = allListings;

      // 模式B：如果URL有listing_id，只保留該單個租盤
      if(targetSingleListingId){
        data = allListings.filter(item => item.id == targetSingleListingId);
        document.getElementById('currentFilterText').innerText = "查看指定租盤";
      }else if (currentDistrictFilter !== 'ALL') {
        data = allListings.filter(item => item.district === currentDistrictFilter);
        document.getElementById('currentFilterText').innerText = `${currentDistrictFilter} 租盤`;
      }else{
        document.getElementById('currentFilterText').innerText = '所有最新租盤';
      }

      document.getElementById('listingCount').innerText = `共 ${data.length} 個租盤`;

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold bg-white rounded-3xl border border-slate-200">該租盤不存在 / 該區暫時未有業主放盤。</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const defaultImg = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80";
        const imgUrl = item.image_url || defaultImg;
        const transportMtr = item.transport_mtr || '鄰近地鐵站';
        const transportBus = item.transport_bus || '多條公車路線';
        const transportChina = item.transport_china || '交通便利';

        const buildingText = item.building_name ? item.building_name.trim() : '';
        const streetText = item.street_address ? item.street_address.trim() : (item.address || '').trim();
        
        let displayLocationText = "";
        if (buildingText && streetText) {
          displayLocationText = `${buildingText} (${streetText})`;
        } else {
          displayLocationText = buildingText || streetText || "詳細地址";
        }

        const mapQueryText = `${buildingText} ${streetText}`;

        let whatsappBtn = item.phone ? `<a href="https://wa.me/852${item.phone.replace(/[^0-9]/g, '')}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-center text-sm shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp</a>` : `<div class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">無WhatsApp</div>`;
        
        let wechatBtn = item.wechat_id ? `<button onclick="copyWeChat('${item.wechat_id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3 rounded-xl text-center text-sm shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-brands fa-weixin text-lg"></i> 微信號</button>` : `<div class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">無微信號</div>`;

        let phoneBtn = item.phone ? `<a href="tel:${item.phone}" class="col-span-2 bg-blue-700 hover:bg-blue-800 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-solid fa-phone text-lg"></i> 致電業主 (${item.phone})</a>` : `<div class="col-span-2 bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">業主未留電話</div>`;

        return `
          <div data-listing-id="${item.id}" class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-md border border-slate-200/90 flex flex-col justify-between transition">
            <div>
              <div class="relative h-56 bg-slate-200">
                <img src="${imgUrl}" alt="租盤圖片" class="w-full h-full object-cover">
                <span class="absolute top-3 left-3 bg-blue-800/90 text-white font-black px-3 py-1 rounded-xl text-base shadow-sm">${item.district || '區域'}</span>
                <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white font-bold px-2.5 py-1 rounded-lg text-xs">30天效期</span>
              </div>
              <div class="p-4 space-y-3">
                <span class="text-3xl font-black text-amber-600 tracking-tight">HK$ ${Number(item.price || 0).toLocaleString()} <span class="text-base font-normal text-slate-500">/月</span></span>
                
                <h4 onclick="openMap('${mapQueryText}')" class="text-lg font-black text-slate-900 leading-snug cursor-pointer hover:text-blue-700 transition" title="點擊在地圖檢視實際地址">
                  <i class="fa-solid fa-location-dot text-red-500 mr-1.5"></i>
                  <span>${displayLocationText}</span>
                </h4>
                
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70 text-sm space-y-2">
                  <div class="text-slate-800 font-bold flex items-center gap-1.5"><i class="fa-solid fa-train-subway text-blue-700"></i><span>${transportMtr}</span></div>
                  <div class="text-slate-600 text-xs flex items-center gap-1.5"><i class="fa-solid fa-bus text-emerald-600"></i><span>${transportBus}</span></div>
                  <div class="text-slate-600 text-xs flex items-center gap-1.5"><i class="fa-solid fa-train-tram text-purple-600"></i><span>${transportChina}</span></div>
                </div>
              </div>
            </div>

            <div class="p-4 pt-0 space-y-2">
              <div class="grid grid-cols-2 gap-2">
                ${whatsappBtn}
                ${wechatBtn}
                ${phoneBtn}
                <!-- 分享本租盤按鈕 -->
                <button onclick="shareSingleListing(${item.id})" class="col-span-2 bg-slate-700 hover:bg-slate-800 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1.5 transition active:scale-95">
                  <i class="fa-solid fa-share-nodes text-lg"></i> 分享這個租盤
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterByDistrict(district) {
      // 按分區篩選時，取消單租盤模式
      targetSingleListingId = null;
      currentDistrictFilter = district;
      renderListings();
    }

    function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
    function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 發布中，請稍候...";

      try {
        const districtVal = document.getElementById('districtInput').value;
        const buildingNameVal = document.getElementById('buildingNameInput').value.trim();
        const streetAddressVal = document.getElementById('streetAddressInput').value.trim();
        const priceVal = Number(document.getElementById('priceInput').value);
        const phoneVal = document.getElementById('phoneInput').value.trim();
        const wechatVal = document.getElementById('wechatInput').value.trim();

        // 校驗
        if (!priceVal || priceVal <= 0) throw new Error("請輸入有效的租金金額");
        if (!buildingNameVal) throw new Error("請輸入大廈名稱");
        if (!phoneVal && !wechatVal) throw new Error("⚠️ 必須至少填寫【電話】或【微信】其中一項聯絡方式！");
        if(phoneVal && !/^[0-9]{8}$/.test(phoneVal)) throw new Error("香港手機號碼必須是8個數字，海外號碼可忽略此檢查");

        // 提交前摘要確認
        const summaryText = `📋 請仔細確認所有資料，確認後會公開給租客瀏覽：
區域：${districtVal}
物業大廈：${buildingNameVal}
街道門牌：${streetAddressVal}
每月租金：HK$${priceVal.toLocaleString()}
🚇鐵路：${document.getElementById('transportMtrInput').value}
🚌巴士：${document.getElementById('transportBusInput').value}
☎️電話：${phoneVal || '沒有填寫'}
💬微信：${wechatVal || '沒有填寫'}

資料一旦發布，租客可以直接看見，是否確認發布？`;
        if(!confirm(summaryText)){
          submitBtn.disabled = false;
          submitBtn.innerText = "🚀 確認發布單位";
          return;
        }

        const newListing = {
          district: districtVal,
          building_name: buildingNameVal,
          street_address: streetAddressVal,
          address: streetAddressVal ? `${buildingNameVal} (${streetAddressVal})` : buildingNameVal, 
          price: priceVal,
          image_url: uploadedBase64Image,
          phone: phoneVal || null,
          wechat_id: wechatVal || null,
          transport_mtr: document.getElementById('transportMtrInput').value,
          transport_bus: document.getElementById('transportBusInput').value,
          transport_china: document.getElementById('transportChinaInput').value
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(newListing)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }

        alert("🎉 租盤發布成功！地址已採用政府標準格式");
        document.getElementById('listingForm').reset();
        uploadedBase64Image = null;
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        closePostModal();
        loadListings();
      } catch (err) {
        console.error(err);
        alert("發布失敗：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 確認發布單位";
      }
    }

    function copyWeChat(id) {
      navigator.clipboard.writeText(id);
      alert(`已複製業主通訊號：${id}`);
    }

    // ========== 分享功能 開始 ==========
    // 分享整個網站
    async function shareWholeWebsite() {
      const siteUrl = window.location.origin + window.location.pathname;
      const shareData = {
        title: "全球智慧租屋網",
        text: "香港業主免費放盤，直接聯絡業主租屋！",
        url: siteUrl
      }
      try {
        await navigator.share(shareData);
      } catch(err) {
        await navigator.clipboard.writeText(siteUrl);
        alert("已複製網站連結！你可以貼到WhatsApp/微信分享");
      }
    }

    // 分享單一個租盤
    async function shareSingleListing(listingId) {
      const listingItem = allListings.find(x => x.id === listingId);
      if(!listingItem) return alert("找不到該租盤資料");

      const listingUrl = `${window.location.origin}${window.location.pathname}?listing_id=${listingId}`;
      const shareText = `🏠租盤推介\n${listingItem.district}｜${listingItem.building_name}\n租金 HK$${Number(listingItem.price).toLocaleString()}/月\n👉立即查看：`;

      const shareData = {
        title: `租盤｜${listingItem.building_name} HK$${listingItem.price}`,
        text: shareText,
        url: listingUrl
      }
      try {
        await navigator.share(shareData);
      } catch(err) {
        await navigator.clipboard.writeText(listingUrl);
        alert("✅租盤連結已複製！直接貼到WhatsApp或微信分享給朋友");
      }
    }

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    // ========== 分享功能結束 ==========
  </script>
</body>
</html>
