    function changeFontSize(size) {
      const body = document.getElementById('appBody');
      body.classList.remove('font-size-md', 'font-size-lg', 'font-size-xl');
      body.classList.add(`font-size-${size}`);

      document.getElementById('btn-md').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById('btn-lg').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById('btn-xl').className = "px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition";
      document.getElementById(`btn-${size}`).className = "px-2.5 py-1 bg-white text-blue-900 rounded-lg font-bold shadow-sm";
    }

    function renderDistrictButtons() {
      const createBtn = d => `<button onclick="filterByDistrict('${d}')" class="district-btn px-3 py-1.5 bg-slate-100 hover:bg-blue-700 hover:text-white rounded-xl font-bold text-sm sm:text-base border border-slate-200/80 transition active:scale-95">${d}</button>`;

      document.getElementById('hkIslandDistricts').innerHTML = districtsData.hkIsland.map(createBtn).join('');
      document.getElementById('ntDistricts').innerHTML = districtsData.nt.map(createBtn).join('');
    }

    function populateDistrictSelect() {
      const select = document.getElementById('districtInput');
      const allDistricts = [...districtsData.kowloon, ...districtsData.hkIsland, ...districtsData.nt];
      select.innerHTML = allDistricts.map(d => `<option value="${d}">${d}</option>`).join('');
      onDistrictChange();
    }

    // 💡 升級版：打字即時動態連動交通（支援弼街等全港街道）
    function onAddressInputTyped() {
      updatePreview();

      const buildingText = document.getElementById('buildingNameInput').value.toLowerCase();
      const streetText = document.getElementById('streetAddressInput').value.toLowerCase();
      const fullText = buildingText + " " + streetText;

      let matchedRule = null;
      for (let rule of keywordTransportRules) {
        if (rule.keywords.some(kw => fullText.includes(kw))) {
          matchedRule = rule;
          break;
        }
      }

      if (matchedRule) {
        document.getElementById('transportMtrInput').value = matchedRule.mtr;
        document.getElementById('transportBusInput').value = matchedRule.bus;
        document.getElementById('transportChinaInput').value = matchedRule.china;
        document.getElementById('districtInput').value = matchedRule.district;
        document.getElementById('transportMatchStatus').innerText = "⚡ 已精準連動街道交通";
        document.getElementById('transportMatchStatus').className = "text-xs font-bold text-purple-700";
      } else {
        onDistrictChange();
        document.getElementById('transportMatchStatus').innerText = "⚡ 區域預載交通";
        document.getElementById('transportMatchStatus').className = "text-xs font-bold text-emerald-600";
      }
    }

      document.getElementById('transportMtrInput').value = info.mtr;
      document.getElementById('transportBusInput').value = info.bus;
      document.getElementById('transportChinaInput').value = info.china;
    }

    function updatePreview() {
      const price = document.getElementById('priceInput').value.trim();
      const building = document.getElementById('buildingNameInput').value.trim();
      const street = document.getElementById('streetAddressInput').value.trim();
      const district = document.getElementById('districtInput').value;

      document.getElementById('previewPrice').innerHTML = price ? `HK$ ${Number(price).toLocaleString()} <span class="text-xs font-normal text-slate-500">/月</span>` : `HK$ 0 <span class="text-xs font-normal text-slate-500">/月</span>`;
      document.getElementById('previewDistrict').innerText = district || '區域';
      
      const buildingText = building || '大廈名稱';
      const streetText = street || '街道門牌';
      document.getElementById('previewAddress').innerText = `${buildingText} | ${streetText}`;
    }

    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          uploadedBase64Image = e.target.result;
          document.getElementById('imagePreview').src = uploadedBase64Image;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function openMap(query) {
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      window.open(url, '_blank');
    }

    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-600"></i><p class="font-bold">載入中...</p></div>`;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        allListings = await response.json();
        renderListings();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-bold">無法載入租盤數據，請重新整理頁面。</div>`;
        document.getElementById('listingCount').innerText = "共 0 個租盤";
      }
    }

    function renderListings() {
      const container = document.getElementById('listingsContainer');
      let data = allListings;

      if (currentDistrictFilter !== 'ALL') {
        data = allListings.filter(item => item.district === currentDistrictFilter);
      }

      document.getElementById('listingCount').innerText = `共 ${data.length} 個租盤`;
      document.getElementById('currentFilterText').innerText = currentDistrictFilter === 'ALL' ? '所有最新租盤' : `${currentDistrictFilter} 租盤`;

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold bg-white rounded-3xl border border-slate-200">該區暫時未有業主放盤。</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const defaultImg = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80";
        const imgUrl = item.image_url || defaultImg;
        const transportMtr = item.transport_mtr || '鄰近地鐵站';
        const transportBus = item.transport_bus || '多條公車路線';
        const transportChina = item.transport_china || '交通便利';

        const buildingDisplay = item.building_name ? `<span class="text-blue-900 font-black">${item.building_name}</span>` : '';
        const streetDisplay = item.street_address ? `<span class="text-slate-700">${item.street_address}</span>` : (item.address || '');
        const fullMapQuery = `${item.building_name || ''} ${item.street_address || item.address || ''}`;

        let whatsappBtn = item.phone ? `<a href="https://wa.me/852${item.phone.replace(/[^0-9]/g, '')}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-center text-sm shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp</a>` : `<div class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">無WhatsApp</div>`;
        
        let wechatBtn = item.wechat_id ? `<button onclick="copyWeChat('${item.wechat_id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3 rounded-xl text-center text-sm shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-brands fa-weixin text-lg"></i> 微信號</button>` : `<div class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">無微信號</div>`;

        let phoneBtn = item.phone ? `<a href="tel:${item.phone}" class="col-span-2 bg-blue-700 hover:bg-blue-800 text-white font-black py-3 rounded-xl text-center text-base shadow flex items-center justify-center gap-1.5 transition active:scale-95"><i class="fa-solid fa-phone text-lg"></i> 致電業主 (${item.phone})</a>` : `<div class="col-span-2 bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-xs border flex items-center justify-center gap-1 cursor-not-allowed">業主未留電話</div>`;

        return `
          <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-md border border-slate-200/90 flex flex-col justify-between transition">
            <div>
              <div class="relative h-56 bg-slate-200">
                <img src="${imgUrl}" alt="租盤圖片" class="w-full h-full object-cover">
                <span class="absolute top-3 left-3 bg-blue-800/90 text-white font-black px-3 py-1 rounded-xl text-base shadow-sm">${item.district || '區域'}</span>
                <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white font-bold px-2.5 py-1 rounded-lg text-xs">30天效期</span>
              </div>
              <div class="p-4 space-y-3">
                <span class="text-3xl font-black text-amber-600 tracking-tight">HK$ ${Number(item.price || 0).toLocaleString()} <span class="text-base font-normal text-slate-500">/月</span></span>
                
                <h4 onclick="openMap('${fullMapQuery}')" class="text-lg font-black text-slate-900 leading-snug cursor-pointer hover:text-blue-700 transition" title="點擊在地圖檢視實際地址">
                  <i class="fa-solid fa-location-dot text-red-500 mr-1.5"></i>
                  ${buildingDisplay} <span class="text-slate-400 font-normal">|</span> ${streetDisplay}
                </h4>
                
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70 text-sm space-y-2">
                  <div class="text-slate-800 font-bold flex items-center gap-1.5"><i class="fa-solid fa-train-subway text-blue-700"></i><span>${transportMtr}</span></div>
                  <div class="text-slate-600 text-xs flex items-center gap-1.5"><i class="fa-solid fa-bus text-emerald-600"></i><span>${transportBus}</span></div>
                  <div class="text-slate-600 text-xs flex items-center gap-1.5"><i class="fa-solid fa-train-tram text-purple-600"></i><span>${transportChina}</span></div>
                </div>
              </div>
            </div>

            <div class="p-4 pt-0 space-y-2">
              <div class="grid grid-cols-2 gap-2">
                ${whatsappBtn}
                ${wechatBtn}
                ${phoneBtn}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterByDistrict(district) {
      currentDistrictFilter = district;
      renderListings();
    }

    function openPostModal() { 
      document.getElementById('postModal').classList.remove('hidden'); 
      updatePreview();
    }
    function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 發布中，請稍候...";

      try {
        const districtVal = document.getElementById('districtInput').value;
        const buildingNameVal = document.getElementById('buildingNameInput').value.trim();
        const streetAddressVal = document.getElementById('streetAddressInput').value.trim();
        const priceVal = Number(document.getElementById('priceInput').value);

        if (!priceVal || priceVal <= 0) throw new Error("請輸入有效的每月租金金額");
        if (!buildingNameVal) throw new Error("請輸入大廈或屋苑名稱");
        if (!streetAddressVal) throw new Error("請輸入詳細街道與門牌");

        const newListing = {
          district: districtVal,
          building_name: buildingNameVal,
          street_address: streetAddressVal,
          address: `${buildingNameVal} | ${streetAddressVal}`, 
          price: priceVal,
          image_url: uploadedBase64Image,
          phone: document.getElementById('phoneInput').value || null,
          wechat_id: document.getElementById('wechatInput').value || null,
          transport_mtr: document.getElementById('transportMtrInput').value,
          transport_bus: document.getElementById('transportBusInput').value,
          transport_china: document.getElementById('transportChinaInput').value
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(newListing)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }

        alert("🎉 租盤發布成功！街道與交通資訊完美即時連動。");
        document.getElementById('listingForm').reset();
        uploadedBase64Image = null;
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        closePostModal();
        loadListings();
      } catch (err) {
        console.error(err);
        alert("發布失敗：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 確認無誤，即時發布";
      }
    }

    function copyWeChat(id) {
      navigator.clipboard.writeText(id);
      alert(`已複製業主通訊號：${id}`);
    }
  </script>
</body>
</html>
